<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceX – vehicle trajectory tracing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f4;--ink:#14213d;--mute:#5b6679;--line:#cfd6e0;--sign:#f5b700;--alert:#c8102e;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Barlow,sans-serif;background:var(--paper);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:#fff}
h1{font:700 28px 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.02em}h1 i{font-style:normal;color:var(--sign)}
h2{font:600 20px 'Barlow Condensed',sans-serif;margin:0 0 8px}
form{display:flex;gap:8px;flex:1;min-width:260px}
input{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:4px;min-width:0}
.plate-in{flex:1;font:600 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;border-color:var(--sign)}
button{font:600 16px 'Barlow Condensed',sans-serif;padding:8px 16px;border:0;border-radius:4px;background:var(--sign);color:var(--ink);cursor:pointer}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;padding:16px 20px;height:calc(100vh - 66px)}
#map{border-radius:6px;border:1px solid var(--line);min-height:380px}
aside{overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.plate{display:inline-block;background:#fff;border:2px solid #111;border-radius:4px;padding:0 8px;font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.1em}
.hit{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.hit:first-of-type{border-top:0}
.hit img,.ph{width:96px;height:64px;object-fit:cover;border-radius:4px;background:#dfe4ea}.ph{display:grid;place-items:center;color:var(--mute);font-size:12px}
.mute{color:var(--mute);font-size:14px}.bad{color:var(--alert);font-weight:500}
.alert{border-left:5px solid var(--alert);padding:4px 10px;margin:6px 0;background:#fff4f5}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:4px 0}
.n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:700 14px Barlow;border:2px solid #fff}
@media(max-width:860px){main{grid-template-columns:1fr;height:auto}#map{height:380px}}
</style></head><body>
<header><h1>Trace<i>X</i></h1>
<form id="f"><input id="q" class="plate-in" placeholder="KA01AB1234" aria-label="Number plate" autocomplete="off"><button>Trace vehicle</button><button type="button" id="play" class="ghost" style="color:#fff">Replay route</button></form></header>
<main><div id="map"></div>
<aside>
<section><h2>Route</h2><div id="route" class="mute">Search a plate to see where it has been, in time order.</div></section>
<section><h2>Live alerts</h2><div id="alerts" class="mute">No alerts yet.</div></section>
<section><h2>Blacklist</h2>
<form id="bf" style="margin-bottom:8px"><input id="bp" placeholder="Plate" required style="width:40%"><input id="br" placeholder="Reason" style="flex:1"><button>Add</button></form>
<div id="bl"></div><button id="seed" class="ghost" style="margin-top:8px">Load demo data</button></section>
</aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))k in e?e[k]=v:e.setAttribute(k,v);kids.flat().forEach(c=>e.append(c));return e}
const api=(u,o)=>fetch('/api'+u,o).then(r=>r.json());
const map=L.map('map').setView([12.97,77.6],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map),camLayer=L.layerGroup().addTo(map);let pts=[],anim;
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'medium'});
async function cams(){camLayer.clearLayers();(await api('/cameras')).forEach(c=>L.circleMarker([c.lat,c.lng],{radius:6,color:'#5b6679',fillOpacity:.6}).bindTooltip(c.name).addTo(camLayer));}
async function trace(plate){
  layer.clearLayers();clearInterval(anim);const d=await api('/vehicles/'+encodeURIComponent(plate)+'/trajectory');pts=d.points;const r=$('route');r.replaceChildren();
  r.className='';r.append(h('div',{className:'row'},h('span',{className:'plate'},d.plate),d.blacklisted?h('span',{className:'bad'},'Blacklisted: '+d.reason):h('span',{className:'mute'},'Not on blacklist')));
  if(!pts.length){r.append(h('p',{className:'mute'},'No sightings for this plate. Try “Load demo data” below.'));return}
  const ll=pts.map(p=>[p.lat,p.lng]).filter(p=>p[0]!=null);
  L.polyline(ll,{color:d.blacklisted?'#c8102e':'#14213d',weight:4,dashArray:'8 6'}).addTo(layer);
  pts.forEach((p,i)=>{if(p.lat==null)return;L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="n">${i+1}</div>`,iconSize:[26,26]})}).bindTooltip(p.camera+' – '+fmt(p.captured_at)).addTo(layer);
    r.append(h('div',{className:'hit'},p.vehicle_url?h('img',{src:p.vehicle_url,alt:'Vehicle at '+p.camera,loading:'lazy'}):h('div',{className:'ph'},'no image'),
      h('div',{},h('b',{},(i+1)+'. '+p.camera),h('div',{className:'mute'},fmt(p.captured_at)),h('div',{className:'mute'},'Confidence '+Math.round(p.confidence*100)+'%'),
      p.plate_url?h('img',{src:p.plate_url,alt:'Plate crop',style:'height:26px;width:auto;margin-top:4px'}):'')))});
  map.fitBounds(ll,{padding:[40,40]});
}
$('f').onsubmit=e=>{e.preventDefault();if($('q').value.trim())trace($('q').value.trim())};
$('play').onclick=()=>{if(!pts.length)return;clearInterval(anim);let i=0;const m=L.circleMarker([0,0],{radius:10,color:'#f5b700',fillOpacity:1}).addTo(layer);
  anim=setInterval(()=>{const p=pts[i++%pts.length];if(p.lat!=null){m.setLatLng([p.lat,p.lng]);map.panTo([p.lat,p.lng])}if(i>pts.length*2)clearInterval(anim)},900)};
function showAlert(a,top=true){const e=h('div',{className:'alert'},h('span',{className:'plate'},a.plate),h('div',{},a.camera+' · '+fmt(a.captured_at)),h('div',{className:'bad'},a.reason));
  const box=$('alerts');if(box.className==='mute'){box.replaceChildren();box.className=''}top?box.prepend(e):box.append(e)}
async function lists(){const al=await api('/alerts');$('alerts').replaceChildren();$('alerts').className=al.length?'':'mute';if(!al.length)$('alerts').textContent='No alerts yet.';al.forEach(a=>showAlert(a,false));
  const bl=await api('/blacklist');$('bl').replaceChildren(...bl.map(b=>h('div',{className:'row'},h('span',{},h('span',{className:'plate',style:'font-size:18px'},b.plate),' ',h('span',{className:'mute'},b.reason)),
    h('button',{className:'ghost',onclick:async()=>{await api('/blacklist/'+b.plate,{method:'DELETE'});lists()}},'Remove'))))}
$('bf').onsubmit=async e=>{e.preventDefault();await api('/blacklist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({plate:$('bp').value,reason:$('br').value||'Flagged'})});$('bp').value=$('br').value='';lists()};
$('seed').onclick=async()=>{await api('/demo/seed',{method:'POST'});await cams();await lists();$('q').value='KA01AB1234';trace('KA01AB1234')};
(function ws(){const s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');s.onmessage=m=>showAlert(JSON.parse(m.data));s.onclose=()=>setTimeout(ws,3000);setInterval(()=>s.readyState===1&&s.send('ping'),25000)})();
cams();lists();
</script></body></html>
